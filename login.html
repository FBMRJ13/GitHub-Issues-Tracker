<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Issues Tracker</title>
    

    <!-- Font Awesome v6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- 1. Tailwind CSS v3 Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. DaisyUI CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />

    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="geist">
    
<fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-2/5 mx-auto  border p-5">
  <div class="flex flex-col justify-center items-center">
    <img src="assets/github-logo.png" alt="">
    <h2 class="font-bold text-2xl">GitHub Issues Tracker</h2>
    <p class="font-medium text-[16px] text-[#64748B]">Sign in to manage your issues</p>
    
  </div>

  <label class="label font-medium text-[16px] pt-6">Username</label>
  <input type="text" id="userName" class="input w-full" placeholder="Enter Username" />
  <p class="text-[#4A00FF] pt-3">Default: admin</p>

  <label class="label font-medium text-[16px] pt-6">Password</label>
  <input type="password" id="pass" class="input w-full" placeholder="Enter Password" />
  <p class="text-[#4A00FF] pt-3">Default: admin123</p>

  <button class="btn btn-primary mt-6 w-full" onclick="login()">Sign In</button>
   <div class="flex flex-col justify-center items-center ">
    <h2 class="font-medium text-xl pt-5">OR</h2>
    <p class="font-medium text-[16px] text-[#64748B] pt-5">Demo Credentials:</p>
    <p class="text-black font-bold pt-5">Username: <span  class="font-medium text-[16px] text-[#64748B]">admin</span></p>
    <p class="text-black font-bold">Password: <span  class="font-medium text-[16px] text-[#64748B]">admin123</span></p>
    
  </div>

</fieldset>

<script src="index.js"></script>
</body>
</html>
