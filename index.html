<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Issues Tracker</title>
    

    <!-- Font Awesome v6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- 1. Tailwind CSS v3 Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. DaisyUI CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />

    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="geist">
    

    <!-- header section -->
     <header class="flex flex-col space-y-5 md:flex-row justify-between items-center p-6 bg-[#F8FAFC] w-11/12 mx-auto">
<div class="header-left flex  justify-center items-center gap-x-1">
    <img class="h-[37px] w-[36px]" src="assets/github-logo.png" alt="">
<h1 class="font-semibold text-2xl">GitHub Issues Tracker</h1>
</div>



<div class="header-right flex justify-center items-center gap-x-3">
    <label class="input shadow-md">
   <g
      stroke-linejoin="round"
      stroke-linecap="round"
      stroke-width="2.5"
      fill="none"
      stroke="currentColor"
    >
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </g>
  </svg>
  <input type="search" required placeholder="Search issues" />
</label>
<button class="btn  btn-primary"><i class="fa-solid fa-magnifying-glass"></i> </button>

</div>

     </header>

    
<!-- all btns section-->

<section class="bg-[#FFFFFF] p-7 space-x-3 shadow-md w-9/12 mx-auto mt-8">
   <button class="btn btn-outline   btn-primary w-28 " id="btn-all" onclick="loadCards('btn-all')">All</button>
   <button class="btn btn-outline btn-primary w-28"  id="btn-open" onclick="loadCards('btn-open')">Opened</button>
   <button class="btn btn-outline btn-primary w-28"  id="btn-close" onclick="loadCards('btn-close')">Closed</button>

</section>


<!-- count number of cards -->

<section class="flex flex-col justify-start items-start gap-y-5 md:flex-row justify-between items-center shadow-md w-9/12 mx-auto mt-8 p-7">

    <div class="flex  gap-x-3">
        <img src="assets/Aperture.png" alt="" class="bg-cyan-200 rounded-full p-2">
        <div>
           <p class="font-semibold text-xl"> <span id="count">count</span>
            Issues</p>
            <p class="font-medium text-[16px]">Track and manage your project issues</p>
        </div>
    </div>

    <div class="flex gap-x-3">
     
       <div class="flex justify-center items-center gap-x-1">
 <div class="bg-green-500 text-neutral-content w-[12px] h-[12px] rounded-full"></div>
 <p>Open</p>

       </div>
       
       <div class="flex justify-center items-center gap-x-1">
 <div class="bg-purple-700 text-neutral-content w-[12px] h-[12px] rounded-full"></div>
 <p>Closed</p>

       </div>
       
       
    </div>
</section>


<!-- card container -->

<section id="card-container" class="bg-[#FBFBFB] mt-10 w-9/12 mx-auto grid grid-cols-3 gap-6">
    <div class="flex flex-col w-[200px] border-t-green-500">
        <div class="flex justify-between items-center">
        <img src="assets/Open-Status.png" alt="">
        <p>High</p>
    </div>
    <h2>Fix navigation menu on mobile devices</h2>
    <p>The navigation menu doesn't collapse properly on mobile devices...</p>
<div class="flex gap-x-3">
    <p class="bg-yellow-300">Bug</p>
    <p>help wanted</p>
</div>
<p>#1
by john_doe</p>
<p>1/15/2024</p>
    </div>
</section>


<script src="index.js"></script>

</body>
</html>
